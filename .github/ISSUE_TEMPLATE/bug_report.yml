name: Ошибка
description: Что-то работает не так — сообщите детали, чтобы ошибку можно было воспроизвести
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не прикладывайте модели, персональные данные и токены — достаточно шагов, версии и логов.
  - type: dropdown
    id: area
    attributes:
      label: Проект
      options:
        - Stone.Revit (Revit-плагины)
        - Бюджетные объёмы
        - Другое
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Версия продукта или сборки
      placeholder: "Stone.Revit 1.12.0 / сборка 2026.10.16.2"
    validations:
      required: true
  - type: input
    id: revit
    attributes:
      label: Версия Revit
      description: Заполните для Stone.Revit
      placeholder: "2024.2"
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Получить ошибку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, скриншот, падение Revit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: "Stone.Revit: C:\\Users\\Public\\Documents\\Stone.Revit\\<Модуль>\\logs\\"
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Проверено
      options:
        - label: Ошибка воспроизводится на последней версии
        - label: В отчёте нет секретов и персональных данных
